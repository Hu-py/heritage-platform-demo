<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上海文物 · 风险与规划响应</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"><body><header><b>◈ 上海文物</b><span>风险评估与规划响应平台</span><small>RESEARCH WORKSPACE / 01</small><em>● 真实数据 · 公开研究数据</em></header><main><aside><label class="eyebrow">HERITAGE OBSERVATORY</label><h1>从文物本体<br>到空间风险</h1><p class="muted">上海市文化遗产保护研究</p><div id="stats" class="stats">数据加载中…</div><input id="search" placeholder="搜索文物名称、地址、编号"><select id="district"><option value="">全部行政区</option></select><h3>地图图层</h3><label>底图不透明度 <span id="basemapValue">45%</span><input id="basemapOpacity" type="range" min="0" max="1" step=".05" value=".45"></label><label><input type="checkbox" id="points" checked> 文物位置</label><label><input type="checkbox" id="boundary" checked> 上海行政边界 <small>坐标系待核验</small></label><label><input type="checkbox" id="buildings"> 建筑轮廓 <small>放大后加载</small></label><label><input type="checkbox" id="risk" checked> 所选文物的开发建设风险范围</label><label>风险图层透明度 <input id="opacity" type="range" min="0" max="0.8" step=".05" value=".3"></label><button id="reset">返回全域</button><h3>文物目录 <small id="count"></small></h3><div id="list"></div></aside><section id="map"><div id="mapnote">地图加载中…</div></section><article><div class="eyebrow">HERITAGE PROFILE</div><h2 id="title">选择一处文物</h2><div id="meta"></div><nav><button data-tab="profile" class="active">本体画像</button><button data-tab="risk">建筑群风险</button><button data-tab="plan">规划响应</button></nav><div id="detail"><p>点击地图上的文物或从左侧目录选择。</p></div></article></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script><script src="app.js"></script></body></html>
